name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: departify_crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/departify_crm_test
      SESSION_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      NODE_ENV: test
      LOG_LEVEL: warn
      RATE_LIMIT_DEFAULT_MAX: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter=@departify-crm/db build
      - run: pnpm --filter=@departify-crm/shared build
      - run: pnpm --filter=@departify-crm/api build
      - run: pnpm --filter=@departify-crm/web build
      - run: pnpm typecheck
      - run: pnpm --filter=@departify-crm/api test
