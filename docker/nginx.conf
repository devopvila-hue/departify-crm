server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API proxy — assumes the API is reachable as "api" within the
  # compose network. Use docker-compose for local dev.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /openapi.json { proxy_pass http://api:4000; }
  location /docs { proxy_pass http://api:4000; }
  location /health { proxy_pass http://api:4000; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
