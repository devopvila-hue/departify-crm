services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: departify_crm
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The single API image serves the SPA out of apps/web/dist/ at the
  # same origin. One port, one process, one healthcheck.
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      APP_BASE_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/departify_crm
      SESSION_SECRET: ${SESSION_SECRET:-please-replace-me-with-32-bytes-of-random}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-please-replace-me-with-32-bytes-of-random}
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    depends_on:
      db: { condition: service_healthy }

  # One-shot helper: run migrations against the DB then exit.
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "--import", "tsx", "packages/db/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/departify_crm
    depends_on:
      db: { condition: service_healthy }
    profiles: ["migrate"]

  # One-shot helper: seed the demo org then exit.
  seed:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "--import", "tsx", "packages/db/src/seed.ts"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/departify_crm
    depends_on:
      db: { condition: service_healthy }
    profiles: ["seed"]

volumes:
  dbdata:
