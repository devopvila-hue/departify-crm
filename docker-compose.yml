services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: departify_crm
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "--import", "tsx", "packages/db/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/departify_crm
    depends_on:
      db: { condition: service_healthy }
    profiles: ["migrate"]

  seed:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "--import", "tsx", "packages/db/src/seed.ts"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/departify_crm
    depends_on:
      db: { condition: service_healthy }
    profiles: ["seed"]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@db:5432/departify_crm
      SESSION_SECRET: ${SESSION_SECRET:-please-replace-me-with-32-bytes-of-random}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-please-replace-me-with-32-bytes-of-random}
      PORT: 4000
      APP_BASE_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:8080
    ports:
      - "4000:4000"
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  dbdata:
